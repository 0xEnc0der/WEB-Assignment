<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amos Maina | Profile</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for a clean, technical look -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Profile Header -->
        <header class="profile-card">
            <div class="photo-container">
                <img src="profile.jpg" alt="Amos Maina" class="profile-img">
            </div>
            <h1>Amos Maina</h1>
            <p class="tagline">Computer Science student, Red Teamer & CTF Player</p>
        </header>

        <!-- Education Section -->
        <section class="content-section">
            <h3>Education</h3>
            <div class="edu-item">
                <span class="year">Current</span>
                <strong>Multimedia University of Kenya</strong>
                <p>Bachelor of Science in Computer Science</p>
            </div>
            <div class="edu-item">
                <span class="year">Alumni</span>
                <strong>Mangu High School</strong>
            </div>
        </section>

        <!-- Contact Info -->
        <section class="content-section">
            <h3>Direct Contact</h3>
            <p>📧 <a href="mailto:amosmaina830@gmail.com">amosmaina830@gmail.com</a></p>
            <p>📞 <a href="tel:0707864316">0707864316</a></p>
        </section>

        <!-- Form Section -->
        <section class="form-section">
            <h3>Send me a Message</h3>
            <form action="#">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="How can I help you?" required></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-submit">Submit Message</button>
                    <button type="reset" class="btn btn-clear">Clear Form</button>
                </div>
            </form>
        </section>
    </div>

</body>
</html>
