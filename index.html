<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Profile Display Section -->
        <section class="profile-card" id="profileDisplay">
            <div class="photo-slot">
                <img id="displayPhoto" src="https://via.placeholder.com/150" alt="Profile Photo">
            </div>
            <h1 id="displayName">Your Name</h1>
            <p class="bio-text" id="displayBio">Your professional bio will appear here once you submit the form.</p>
            
            <div class="info-group">
                <h3>Education</h3>
                <p id="displayEdu">Degree / Institution</p>
            </div>

            <div class="info-group">
                <h3>Contact</h3>
                <p id="displayContact">email@example.com</p>
            </div>
        </section>

        <!-- Form Entry Section -->
        <section class="form-container">
            <h2>Update Profile Details</h2>
            <form id="profileForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="inputName" placeholder="Enter name" required>
                </div>

                <div class="input-group">
                    <label>Photo URL</label>
                    <input type="url" id="inputPhoto" placeholder="Paste image link">
                </div>

                <div class="input-group">
                    <label>Education</label>
                    <input type="text" id="inputEdu" placeholder="e.g. BSc Computer Science" required>
                </div>

                <div class="input-group">
                    <label>Contact Email</label>
                    <input type="email" id="inputContact" placeholder="example@mail.com" required>
                </div>

                <div class="input-group">
                    <label>Short Bio</label>
                    <textarea id="inputBio" rows="4" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="button-row">
                    <button type="submit" class="btn-submit">Update Profile</button>
                    <button type="reset" class="btn-reset">Clear Form</button>
                </div>
            </form>
            
            <div id="successMessage" class="hidden">
                Data submitted successfully!
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
